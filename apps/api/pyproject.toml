[project]
name = "envirescue-api"
version = "0.1.0"
description = "FastAPI backend and AI integration for EnviRescue"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.15.1,<2",
  "asyncpg>=0.30.0,<1",
  "email-validator>=2.2.0,<3",
  "fastapi>=0.115.11,<1",
  "httpx>=0.28.1,<1",
  "pillow>=11.1.0,<12",
  "pydantic-settings>=2.8.1,<3",
  "pyjwt>=2.10.1,<3",
  "pwdlib[argon2]>=0.2.1,<1",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0.39,<3",
  "upstash-redis>=1.3.0,<2",
  "uvicorn[standard]>=0.34.0,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.15.0,<2",
  "pytest>=8.3.5,<9",
  "pytest-asyncio>=0.25.3,<1",
  "ruff>=0.11.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
